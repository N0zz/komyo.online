<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · Komyo Games</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0b0f17">
<style>
  :root {
    --bg:#0b0f17; --surface:#161c28; --surface-2:#1e2738; --border:#2a3446;
    --text:#eef2f8; --muted:#aab6c8; --faint:#7d8aa0;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:var(--sans); }
  body { padding: 44px 22px 56px; line-height:1.5; }
  .wrap { max-width: 720px; margin: 0 auto; text-align:center; }

  .brand { display:flex; align-items:center; justify-content:center; gap: clamp(10px, 2.5vw, 18px); }
  .mascot { width: clamp(46px, 9vw, 68px); height: auto; flex:none; }
  h1 { margin:0; font-size: clamp(24px, 5vw, 38px); letter-spacing:.5px; }

  .code { margin: 30px 0 6px; font-family:var(--mono); font-size: clamp(52px, 15vw, 96px);
    line-height:1; color:#9fe8ff; text-shadow: 0 0 26px rgba(159,232,255,.35); }
  .msg { font-size: clamp(16px, 3vw, 19px); margin: 0 0 6px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom: 28px; }
  .path { font-family:var(--mono); color:var(--faint); font-size:13px; word-break:break-all; }

  .home { display:inline-block; padding: 13px 22px; border-radius: 12px; font-weight:600;
    text-decoration:none; color:#08121a; background:#9fe8ff; border:1px solid #9fe8ff;
    box-shadow: 0 6px 22px rgba(159,232,255,.22); }
  .home:hover { filter:brightness(1.08); }

  .picks-h { margin: 40px 0 14px; color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:1.4px; }
  .picks { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .pick { display:flex; align-items:center; gap:8px; padding:9px 14px; border-radius:11px;
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    text-decoration:none; font-size:14px; }
  .pick:hover { background:var(--surface-2); }
  .pick .ic { font-size:18px; line-height:1; }

  /* short viewports (landscape phones): keep the back-button above the fold */
  @media (max-height: 520px) {
    body { padding-top: 20px; padding-bottom: 24px; }
    .mascot { width: clamp(38px, 7vw, 46px); }
    h1 { font-size: clamp(20px, 4vw, 26px); }
    .code { margin: 12px 0 4px; font-size: clamp(40px, 9vh, 56px); }
    .sub { margin-bottom: 16px; }
    .picks-h { margin: 20px 0 10px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <svg class="mascot" viewBox="0 -4.5 64 64" role="img" aria-label="Komyo Games mascot">
        <path d="M13 28 L17 5 L31 17 Z" fill="#f0712f"/>
        <path d="M51 28 L47 5 L33 17 Z" fill="#f0712f"/>
        <path d="M17 21 L19 9 L26 16 Z" fill="#ffd9b0"/>
        <path d="M47 21 L45 9 L38 16 Z" fill="#ffd9b0"/>
        <path d="M12 35 Q12 13 32 13 Q52 13 52 35 L52 45 Q52 41 48 41 L16 41 Q12 41 12 45 Z" fill="#f0712f"/>
        <ellipse cx="32" cy="35" rx="16" ry="15" fill="#ffe3c8"/>
        <path d="M16 31 Q18 19 32 19 Q46 19 48 31 Q44 25 38 26 Q40 29 36 30 Q33 25 28 27 Q30 30 24 29 Q20 27 16 31 Z" fill="#f0712f"/>
        <ellipse cx="25" cy="37" rx="2.6" ry="3.5" fill="#3a2a1a"/>
        <ellipse cx="39" cy="37" rx="2.6" ry="3.5" fill="#3a2a1a"/>
        <circle cx="26" cy="35.6" r="1" fill="#fff"/>
        <circle cx="40" cy="35.6" r="1" fill="#fff"/>
        <circle cx="20.5" cy="41" r="2.3" fill="#ff9ba0" opacity=".7"/>
        <circle cx="43.5" cy="41" r="2.3" fill="#ff9ba0" opacity=".7"/>
        <path d="M29 43 Q32 46 35 43" stroke="#7a4a2a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </svg>
      <h1>Komyo Games</h1>
    </div>

    <div class="code">404</div>
    <p class="msg">That page isn't on the map.</p>
    <div class="sub"><span class="path" id="path"></span></div>

    <a class="home" href="/">← Back to the arcade</a>

    <div class="picks-h">or play something</div>
    <div class="picks" id="picks"></div>
  </div>

  <script src="/games.js"></script>
  <script>
  (function () {
    var p = document.getElementById('path');
    if (p) p.textContent = location.pathname;

    var live = (window.GAMES || []).filter(function (g) { return !g.soon; });
    var box = document.getElementById('picks');
    if (!box || !live.length) return;
    for (var i = live.length - 1; i > 0; i--) {         // shuffle, then take 5
      var j = Math.floor(Math.random() * (i + 1)), t = live[i]; live[i] = live[j]; live[j] = t;
    }
    live.slice(0, 5).forEach(function (g) {
      var a = document.createElement('a');
      a.className = 'pick';
      a.href = '/games/' + g.slug + '/';
      a.innerHTML = '<span class="ic"></span><span class="tt"></span>';
      a.querySelector('.ic').textContent = g.icon || '🎮';
      a.querySelector('.tt').textContent = g.title;
      if (g.accent) a.style.borderColor = 'color-mix(in srgb, ' + g.accent + ' 40%, var(--border))';
      box.appendChild(a);
    });
  })();
  </script>
</body>
</html>
